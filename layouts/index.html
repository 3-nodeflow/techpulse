<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <title>{{ .Site.Title }}</title>
</head>
<body>
    <h1>{{ .Site.Title }}</h1>
    <ul>
    {{ range .Site.RegularPages }}
        <li>
            <a href="{{ .RelPermalink }}">{{ .Title }}</a> - {{ .Date.Format "02/01/2006" }}
        </li>
    {{ end }}
    </ul>
</body>
</html>
