baseURL = 'https://3-nodeflow.github.io/techpulse/'
languageCode = 'pt-pt'
title = 'TechPulse AI | Análises de Telemóveis & Gadgets'
theme = 'PaperMod'

enableInlineShortcodes = true
enableRobotsTXT = true
buildFuture = true

[pagination]
  pagerSize = 10

[params]
  env = 'production'
  title = 'TechPulse AI'
  description = 'As melhores análises de smartphones, laptops e gadgets de consumo com ofertas da Amazon Brasil.'
  author = 'TechPulse Team'
  
  # Estilo Visual e Recursos
  defaultTheme = 'auto'
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false

  # Ativar Imagens de Capa nos Cartões da Homepage
  [params.cover]
    hidden = false          # Exibe a imagem dentro do post
    hiddenInList = false    # Exibe a imagem nos cartões da Homepage
    hiddenInSingle = false

  # Banner Inicial de Boas-Vindas
  [params.homeInfoParams]
    Title = "TechPulse AI 📱💻"
    Content = "Análises imparciais e diárias sobre os mais recentes telemóveis, portáteis e gadgets. Encontre as melhores ofertas e recomendações verificadas na Amazon Brasil."

  # Menu Superior
  [[params.mainMenuItems]]
    name = "Análises & Reviews"
    url = "posts/"
    weight = 10

  [[params.mainMenuItems]]
    name = "Categorias"
    url = "categories/"
    weight = 20

  [[params.mainMenuItems]]
    name = "Tags"
    url = "tags/"
    weight = 30

[permalinks]
  posts = '/posts/:slug/'