baseURL = '/'
relativeURLs = true
canonifyURLs = false
languageCode = 'pt-pt'
title = 'TechPulse AI | Análises de Telemóveis & Gadgets'
theme = 'PaperMod'

enableInlineShortcodes = true
enableRobotsTXT = true
buildFuture = true

[pagination]
  pagerSize = 10

# 1. Parâmetros Simples (devem ficar no topo de [params])
[params]
  env = 'production'
  title = 'TechPulse AI'
  description = 'As melhores análises de smartphones, laptops e gadgets de consumo com ofertas da Amazon Brasil.'
  author = 'TechPulse Team'
  
  defaultTheme = 'auto'
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false

# 2. Sub-bloco para Imagens de Capa
[params.cover]
  hidden = false
  hiddenInList = false
  hiddenInSingle = false

# 3. Sub-bloco do Banner da Homepage
[params.homeInfoParams]
  Title = "TechPulse AI 📱💻"
  Content = "Análises imparciais e diárias sobre os mais recentes telemóveis, portáteis e gadgets. Encontre as melhores ofertas e recomendações verificadas na Amazon Brasil."

# 4. Sintaxe Oficial de Menus do Hugo / PaperMod
[[menu.main]]
  name = "Análises"
  url = "posts/"
  weight = 10

[[menu.main]]
  name = "Sobre"
  url = "sobre/"
  weight = 20

[[menu.main]]
  name = "Contacto"
  url = "contacto/"
  weight = 30

[[menu.main]]
  name = "Privacidade"
  url = "politica-de-privacidade/"
  weight = 40

[[menu.main]]
  name = "Categorias"
  url = "categories/"
  weight = 50

[[menu.main]]
  name = "Tags"
  url = "tags/"
  weight = 60

[permalinks]
  posts = '/posts/:slug/'
