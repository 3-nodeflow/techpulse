baseURL = 'https://3-nodeflow.github.io/techpulse/'
languageCode = 'pt-pt'
title = 'TechPulse AI'
theme = 'pehtheme-hugo'

enableInlineShortcodes = true
enableRobotsTXT = true
buildFuture = true

[pagination]
  pagerSize = 10

[params]
  description = 'Análises automatizadas dos melhores smartphones, laptops e gadgets de consumo com ofertas verificadas.'
  
  # Nome do bloco/categoria da página inicial (substitui "Astronomy")
  homeCategory = 'Análises Recentes'

  # Estrutura do Autor e Rodapé customizado
  [params.author]
    name = 'TechPulse AI'
    bio = 'Análises diárias e imparciais sobre os mais recentes smartphones, laptops e gadgets com inteligência artificial.'

  # Textos do Rodapé (substitui o Lorem Ipsum e "built in Rembele")
  [params.footer]
    tagline = 'Análises modernas e diretas ao ponto. Atualizado diariamente via IA.'
    text = 'O TechPulse AI ajuda-o a escolher os melhores dispositivos tecnológicos com links e ofertas atualizadas na Amazon Brasil.'
    copyright = '© 2026 TechPulse AI. Todos os direitos reservados.'

[permalinks]
  posts = '/posts/:slug/'
